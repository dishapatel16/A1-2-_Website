<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Data Science | University of Regina</title>
  <style>
:root {
  --background: oklch(0.977 0.008 95);
  --foreground: oklch(0.23 0.03 160);
  --card: oklch(0.995 0.004 95);
  --primary: oklch(0.37 0.07 158);
  --primary-foreground: oklch(0.985 0.008 95);
  --secondary: oklch(0.94 0.018 150);
  --muted: oklch(0.955 0.012 100);
  --muted-foreground: oklch(0.46 0.02 155);
  --border: oklch(0.88 0.015 110);
  --gold: oklch(0.78 0.13 85);
  --pine: oklch(0.28 0.045 160);
  --cream: oklch(0.96 0.02 95);
  --stat: oklch(0.55 0.08 190);
  --math: oklch(0.5 0.08 250);
  --option: oklch(0.62 0.03 80);
  --other: oklch(0.72 0.02 80);
  --elective: oklch(0.82 0.02 95);
  --sans: "Source Sans 3", "Segoe UI", sans-serif;
  --display: Fraunces, Georgia, serif;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  min-height: 100vh;
  background: var(--background);
  color: var(--foreground);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.5;
}
img { max-width: 100%; display: block; }
button, input { font: inherit; }
a { color: inherit; }
.lead a { color: var(--primary); text-decoration: underline; text-underline-offset: 0.18em; }
h1, h2, h3, .display { font-family: var(--display); font-weight: 560; letter-spacing: -0.02em; }
h1 { font-size: clamp(2.4rem, 5vw, 3.2rem); line-height: 1.05; margin: 0.6rem 0 0; }
h2 { font-size: clamp(1.8rem, 3vw, 2.3rem); line-height: 1.15; margin: 0.35rem 0 0; }
h3 { margin: 0; }

.wrap { width: min(72rem, calc(100% - 2rem)); margin-inline: auto; }
.kicker { font-size: 0.75rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--primary); margin: 0; }
.muted { color: var(--muted-foreground); }
.lead { max-width: 42rem; }
.lead p { margin: 0 0 1rem; line-height: 1.7; }

.header {
  position: sticky; top: 0; z-index: 40;
  background: var(--pine); color: white;
  border-bottom: 1px solid rgb(255 255 255 / 0.1);
}
.header-inner { display: flex; align-items: center; gap: 1rem; padding: 0.75rem 0; }
.brand { display: flex; align-items: center; gap: 0.75rem; text-decoration: none; min-width: 0; }
.brand img { height: 2.25rem; width: auto; }
.brand-sub {
  display: none;
  border-left: 1px solid rgb(255 255 255 / 0.25);
  padding-left: 0.75rem;
  font-size: 0.75rem;
  line-height: 1.25;
  color: rgb(255 255 255 / 0.8);
}
.nav { margin-left: auto; display: none; gap: 0.25rem; }
.nav a, .sheet a {
  text-decoration: none;
  border-radius: 0.4rem;
  padding: 0.5rem 0.75rem;
  font-size: 0.9rem;
  color: rgb(255 255 255 / 0.8);
}
.nav a:hover, .nav a[aria-current="page"] { background: rgb(255 255 255 / 0.1); color: white; }
.nav a[aria-current="page"] { color: var(--gold); }
.menu-btn {
  margin-left: auto;
  display: grid; place-items: center;
  width: 2.25rem; height: 2.25rem;
  border-radius: 0.5rem;
  border: 1px solid rgb(255 255 255 / 0.2);
  background: transparent; color: white; cursor: pointer;
}
.sheet-back {
  position: fixed; inset: 0; background: rgb(0 0 0 / 0.35); z-index: 50;
}
.sheet {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(20rem, 80vw);
  background: var(--background); color: var(--foreground); z-index: 51;
  padding: 1.25rem; box-shadow: -8px 0 30px rgb(0 0 0 / 0.12);
}
.sheet header { display: flex; justify-content: space-between; align-items: center; }
.sheet a { display: block; color: var(--foreground); padding: 0.8rem 0.4rem; }
.sheet a:hover { background: var(--muted); }
.icon-btn { border: 0; background: transparent; cursor: pointer; font-size: 1.3rem; }

.crumbs { font-size: 0.9rem; color: var(--muted-foreground); margin: 0; }
.hero {
  background: var(--card);
  border-bottom: 1px solid var(--border);
}
.hero-grid {
  display: grid; gap: 2rem; padding: 2.5rem 0 3rem;
}
.pills { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 1.2rem; }
.pill, .btn, .chip {
  border-radius: 999px; border: 0; cursor: pointer;
  padding: 0.45rem 1rem; font-size: 0.9rem;
}
.pill { background: var(--muted); color: var(--foreground); }
.pill[aria-pressed="true"], .chip[aria-pressed="true"] {
  background: var(--primary); color: var(--primary-foreground);
}
.pill.ghost { background: var(--card); box-shadow: inset 0 0 0 1px var(--border); }
.actions { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-top: 1.4rem; }
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  text-decoration: none; height: 2.5rem; padding-inline: 1rem;
  background: var(--primary); color: var(--primary-foreground);
}
.btn.outline { background: transparent; color: var(--foreground); box-shadow: inset 0 0 0 1px var(--border); }
.btn.sm { height: 2rem; font-size: 0.85rem; background: white; color: var(--foreground); box-shadow: inset 0 0 0 1px var(--border); }
.notice {
  border: 1px solid color-mix(in oklch, var(--gold) 60%, white);
  background: color-mix(in oklch, var(--gold) 18%, white);
  border-radius: 0.6rem; padding: 0.55rem 0.75rem; font-size: 0.9rem;
}
.facts {
  background: var(--pine); color: white; border-radius: 1rem; padding: 1.25rem;
  height: fit-content;
}
.facts dt { font-size: 0.75rem; color: rgb(255 255 255 / 0.6); }
.facts dd { margin: 0 0 0.7rem; font-size: 0.92rem; }
.facts a { color: var(--gold); font-size: 0.9rem; }

.section { padding: 3.5rem 0; }
.split { display: grid; gap: 2.5rem; }
.accordion { border-top: 1px solid var(--border); }
.acc-btn {
  width: 100%; text-align: left; background: none; border: 0;
  border-bottom: 1px solid var(--border); padding: 1rem 0;
  display: flex; justify-content: space-between; gap: 1rem; cursor: pointer;
  font-size: 1rem;
}
.acc-btn .code { font-family: ui-monospace, monospace; font-size: 0.75rem; color: var(--primary); margin-right: 0.5rem; }
.acc-panel { display: none; color: var(--muted-foreground); padding: 0 0 1rem; line-height: 1.6; }
.acc-item.open .acc-panel { display: block; }
.cards3 { display: grid; gap: 1rem; margin-top: 2rem; }
.soft { background: color-mix(in oklch, var(--secondary) 60%, white); border-radius: 1rem; padding: 1.25rem; }
.soft p { margin: 0.5rem 0 0; font-size: 0.92rem; line-height: 1.6; }
.soft h3 { font-size: 1.25rem; margin: 0; }
.link-list { list-style: none; margin: 0.8rem 0 0; padding: 0; display: grid; gap: 0.55rem; }
.link-list a { color: var(--primary); }
a.card { display: block; text-decoration: none; color: inherit; }

.skills { background: var(--pine); color: white; scroll-margin-top: 5.5rem; }
.skills .kicker { color: var(--gold); }
.skills .intro { color: rgb(255 255 255 / 0.75); font-size: 0.95rem; line-height: 1.6; max-width: 40rem; }
.skill-layout { display: grid; gap: 1rem; margin-top: 1.5rem; }
.skill-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.65rem; }
.skill-card {
  display: flex; align-items: center; gap: 0.7rem;
  text-align: left; cursor: pointer;
  border-radius: 0.9rem; border: 1px solid rgb(255 255 255 / 0.16);
  background: rgb(255 255 255 / 0.04); color: white;
  padding: 0.75rem 0.8rem;
}
.skill-card:hover { border-color: rgb(255 255 255 / 0.4); }
.skill-card[aria-pressed="true"] { background: var(--gold); color: var(--pine); border-color: var(--gold); }
.skill-ico {
  width: 2.25rem; height: 2.25rem; flex: none;
  display: grid; place-items: center; border-radius: 0.65rem;
  background: rgb(255 255 255 / 0.08);
}
.skill-card[aria-pressed="true"] .skill-ico { background: rgb(0 0 0 / 0.08); }
.skill-ico svg { width: 1.25rem; height: 1.25rem; }
.skill-card strong { display: block; font-size: 0.92rem; }
.skill-card small { display: block; font-size: 0.75rem; opacity: 0.75; }
.skill-detail {
  background: white; color: var(--foreground);
  border-radius: 1rem; padding: 1.25rem 1.3rem;
  box-shadow: 0 16px 40px rgb(0 0 0 / 0.18);
}
.skill-detail h3 { font-size: 1.7rem; margin-top: 0.35rem; }
.skill-detail p { line-height: 1.6; }
.skill-points { margin: 0.4rem 0 0; padding: 0; list-style: none; display: grid; gap: 0.45rem; }
.skill-points li { display: flex; gap: 0.5rem; font-size: 0.92rem; }
.skill-points li::before { content: ""; width: 0.45rem; height: 0.45rem; margin-top: 0.45rem; border-radius: 99px; background: var(--gold); flex: none; }
.lab { background: var(--pine); color: white; }
.lab .kicker { color: var(--gold); }
.lab-grid { display: grid; gap: 2rem; align-items: start; }
.lab p.intro { color: rgb(255 255 255 / 0.75); font-size: 0.92rem; line-height: 1.6; }
.aud { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 1.2rem; }
.aud button {
  border-radius: 999px; border: 1px solid rgb(255 255 255 / 0.2);
  background: transparent; color: white; text-align: left; padding: 0.45rem 0.8rem; cursor: pointer;
}
.aud button[aria-pressed="true"] { background: var(--gold); color: var(--pine); border-color: var(--gold); }
.aud small { display: block; font-size: 0.75rem; opacity: 0.7; }
.check { display: flex; gap: 0.5rem; margin-top: 1rem; font-size: 0.92rem; color: rgb(255 255 255 / 0.85); }
.panel { background: white; color: var(--foreground); border-radius: 1rem; padding: 1.25rem; box-shadow: 0 16px 40px rgb(0 0 0 / 0.18); }
.panel-top { display: flex; justify-content: space-between; align-items: center; gap: 0.75rem; }
.bars { display: flex; align-items: flex-end; gap: 0.35rem; height: 12rem; margin-top: 1rem; }
.bars button { flex: 1; height: 100%; border: 0; background: none; padding: 0; cursor: pointer; display: flex; align-items: flex-end; }
.bar { width: 100%; border-radius: 2px 2px 0 0; opacity: 0.85; }
.bars button[aria-pressed="true"] .bar { opacity: 1; outline: 2px solid var(--pine); outline-offset: 2px; }
.bar.heavy { background: var(--gold); }
.bar.light { background: var(--primary); }
.week-labels { display: flex; gap: 0.35rem; margin-top: 0.35rem; }
.week-labels span { flex: 1; text-align: center; font-size: 0.65rem; color: var(--muted-foreground); }
.legend { display: flex; gap: 1rem; flex-wrap: wrap; margin-top: 0.7rem; font-size: 0.75rem; color: var(--muted-foreground); }
.swatch { width: 0.65rem; height: 0.65rem; display: inline-block; border-radius: 2px; margin-right: 0.3rem; vertical-align: middle; }
.result { margin-top: 1.1rem; background: var(--cream); border-radius: 0.8rem; padding: 1rem; }
.result .who { font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted-foreground); margin: 0; }
.result .copy { font-family: var(--display); font-size: 1.3rem; line-height: 1.3; white-space: pre-line; margin: 0.4rem 0 0; }

.tabs { display: flex; gap: 0.5rem; overflow-x: auto; margin-top: 1.2rem; }
.chip {
  background: var(--card); color: var(--foreground);
  box-shadow: inset 0 0 0 1px var(--border); white-space: nowrap;
  display: inline-flex; align-items: center; gap: 0.45rem;
  transition: background-color 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
}
.chip svg { width: 1rem; height: 1rem; flex: none; }
.tabs .chip:hover {
  background-color: var(--cream);
  box-shadow: inset 0 0 0 2px var(--primary);
}
.tabs .chip[aria-pressed="true"],
.tabs .chip[aria-pressed="true"]:hover {
  background-color: var(--primary);
  color: var(--primary-foreground);
  box-shadow: none;
}
.chip:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.career {
  margin-top: 1rem; background: var(--card); border-radius: 1rem; padding: 1.25rem;
  box-shadow: 0 0 0 1px color-mix(in oklch, var(--foreground) 10%, transparent);
  display: grid; gap: 1rem;
}
.course-list { background: color-mix(in oklch, var(--muted) 70%, white); border-radius: 0.8rem; padding: 1rem; }
.course-list li { list-style: none; background: var(--background); border-radius: 0.4rem; padding: 0.45rem 0.7rem; margin-top: 0.45rem; font-size: 0.9rem; }
.course-list ul { margin: 0; padding: 0; }

.faq { background: var(--card); border-top: 1px solid var(--border); }
.faq-head { display: flex; flex-direction: column; gap: 1rem; }
.search {
  height: 2.5rem; width: 100%; border-radius: 0.6rem; border: 1px solid var(--border);
  background: var(--background); padding: 0 0.7rem;
}
.empty { margin-top: 1.5rem; border: 1px dashed var(--border); border-radius: 0.8rem; padding: 2rem 1rem; color: var(--muted-foreground); }

.mix { display: flex; height: 3rem; border-radius: 0.8rem; overflow: hidden; box-shadow: inset 0 0 0 1px var(--border); margin-top: 0.4rem; }
.mix button { border: 0; color: white; cursor: pointer; font-size: 0.75rem; }
@media (max-width: 639px) { .mix .count { position: absolute; width: 1px; height: 1px; overflow: hidden; } }
.mix button.elective { color: var(--pine); }
.filters { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.8rem; }
.filters button {
  border-radius: 999px; background: transparent; cursor: pointer;
  box-shadow: inset 0 0 0 1px var(--border); padding: 0.25rem 0.7rem; font-size: 0.75rem;
  display: inline-flex; align-items: center; gap: 0.35rem;
}
.filters button[aria-pressed="true"] { background: var(--pine); color: white; }
.dot { width: 0.5rem; height: 0.5rem; border-radius: 999px; display: inline-block; }
.grid2 { display: grid; gap: 0.75rem; margin-top: 1.2rem; padding: 0; list-style: none; }
.card {
  width: 100%; text-align: left; background: var(--card); border: 0; border-radius: 1rem;
  padding: 1rem; cursor: pointer;
  box-shadow: 0 0 0 1px color-mix(in oklch, var(--foreground) 10%, transparent);
}
.card:hover { box-shadow: 0 0 0 1px color-mix(in oklch, var(--primary) 40%, transparent); }
.card-top { display: flex; justify-content: space-between; gap: 0.5rem; align-items: center; }
.badge { background: var(--secondary); border-radius: 999px; font-size: 0.72rem; padding: 0.1rem 0.45rem; }
.card h3 { font-size: 1.25rem; margin-top: 0.45rem; }
.card p { color: var(--muted-foreground); font-size: 0.9rem; line-height: 1.55; }

.modal-back { position: fixed; inset: 0; background: rgb(0 0 0 / 0.35); z-index: 60; display: grid; place-items: center; padding: 1rem; }
.modal {
  width: min(36rem, 100%); background: var(--card); border-radius: 1rem; padding: 1.25rem 1.25rem 1.4rem;
  position: relative; box-shadow: 0 20px 50px rgb(0 0 0 / 0.2);
}
.modal .x { position: absolute; top: 0.6rem; right: 0.7rem; }
.modal p { line-height: 1.6; }

.footer { margin-top: 4rem; background: var(--pine); color: white; }
.footer-grid { display: grid; gap: 2rem; padding: 2.5rem 0; }
.footer img { height: 3rem; width: auto; }
.footer p { color: rgb(255 255 255 / 0.75); font-size: 0.92rem; line-height: 1.6; }
.footer a { color: rgb(255 255 255 / 0.85); }
.footer .label { font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: rgb(255 255 255 / 0.6); }
.footer ul { padding: 0; margin: 0.6rem 0 0; list-style: none; display: grid; gap: 0.4rem; font-size: 0.9rem; }
.footer-bar { border-top: 1px solid rgb(255 255 255 / 0.1); font-size: 0.75rem; color: rgb(255 255 255 / 0.6); padding: 0.9rem 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

@media (min-width: 640px) {
  .brand-sub { display: block; }
  .brand img { height: 2.75rem; }
  .faq-head { flex-direction: row; justify-content: space-between; align-items: end; }
  .search { max-width: 18rem; }
  .grid2 { grid-template-columns: 1fr 1fr; }
  .week-labels span { font-size: 0.75rem; }
}
@media (min-width: 800px) {
  .nav { display: flex; }
  .menu-btn { display: none; }
  .hero-grid { grid-template-columns: minmax(0, 1fr) 320px; align-items: start; }
  .facts { position: sticky; top: 6rem; }
  .split, .lab-grid, .skill-layout, .career, .footer-grid { grid-template-columns: 0.9fr 1.1fr; }
  .skill-grid { grid-template-columns: 1fr; }
  .cards3 { grid-template-columns: repeat(3, 1fr); }
  .career { grid-template-columns: 1.2fr 0.8fr; }
}

  </style>
</head>
<body>
  <div id="app"></div>
  <script>
window.SITE_DATA = {
  "courses": [
    {
      "code": "CS 110",
      "name": "Programming and Problem Solving",
      "area": "CS",
      "credits": "3",
      "level": "Undergraduate",
      "summary": "First programming course: break a problem into steps a computer can carry out.",
      "detail": "Students start the degree by learning how to express a procedure clearly. The habit matters later, when a notebook has to show both the code and the reason it was written."
    },
    {
      "code": "CS 115",
      "name": "Object-Oriented Design",
      "area": "CS",
      "credits": "3",
      "level": "Undergraduate",
      "summary": "Organize larger programs around objects, interfaces, and responsibility.",
      "detail": "Data work rarely stays a single script. This course is where students practise structuring code so a teammate can change one part without breaking the rest."
    },
    {
      "code": "CS 165 or STAT 165",
      "name": "Introduction to Programming with Python",
      "area": "Joint",
      "credits": "3",
      "level": "Undergraduate",
      "summary": "Python as the shared language of the data science courses.",
      "detail": "The same course can be taken as computer science or statistics. That cross-listing is the degree in miniature: one toolkit, two departments."

    {
      "code": "CS 210",
      "name": "Data Structures and Abstractions",
      "area": "CS",
      "credits": "3",
      "level": "Undergraduate",
      "summary": "How data is stored, and what that choice costs in time and memory.",
      "detail": "Stacks, queues, trees, hashing, recursion, and asymptotic notation. The point for a data scientist is practical: the way a table is organized changes what questions you can afford to ask."
    },
    {
      "code": "CS 220",
      "name": "Theoretical Foundations",
      "area": "CS",
      "credits": "3",
      "level": "Undergraduate",
      "summary": "The mathematical ideas underneath computation.",
      "detail": "A short course in the theory that later algorithm and learning courses assume. It is less about a tool and more about knowing what a computer cannot magically skip."
    },
    {
      "code": "CS 261 or MATH 261",
      "name": "Methods in Numerical Analysis",
      "area": "Joint",
      "credits": "3",
      "level": "Undergraduate",
      "summary": "Approximate answers, and how much error those approximations carry.",
      "detail": "Real measurements are messy and many formulas do not have a tidy closed form. Numerical methods are how a program still produces a usable number, with the error kept in view."
    },
    {
      "code": "CS 265",

      "area": "CS",
      "credits": "3",

    {
      "code": "CS 321",
      "name": "Machine Learning",
      "area": "CS",
      "credits": "3",
      "level": "Undergraduate",
      "summary": "Models that learn patterns, and the checks that keep them honest.",
      "detail": "Follows the artificial intelligence course with a fuller treatment of learning methods students will later meet again in statistical learning."
    },
    {
      "code": "CS 340",
      "name": "Advanced Data Structures and Algorithm Design",
      "area": "CS",
      "credits": "3",
      "level": "Undergraduate",
      "summary": "Graph algorithms, strategy, and the cost of a method.",
      "detail": "Traversals, pattern matching, greedy methods, divide-and-conquer, dynamic programming, and the basics of parallel algorithms. Useful when a dataset is large enough that a careless loop is not a plan."
    },
    {
      "code": "CS 365",
      "name": "Data Wrangling",
      "area": "CS",
      "credits": "3",
      "level": "Undergraduate",
      "summary": "Turn messy source data into a table you are willing to analyze.",
      "detail": "Most of a real project is spent here: missing values, odd formats, joins that do not quite match, and a record of what was changed. A result that skips this step is hard to defend."

    {
      "code": "CS 375",
      "name": "Database and Information Retrieval",
      "area": "CS",
      "credits": "3",
      "level": "Undergraduate",
      "summary": "Store data so it can be queried, not just opened.",
      "detail": "Conceptual and relational modelling, query languages, transactions, and retrieval. The course sits under every later project that starts from more than one spreadsheet."
    },
    {
      "code": "CS 465",
      "name": "Data Mining",
      "area": "CS",
      "credits": "3",
      "level": "Undergraduate",
      "summary": "Find patterns: classes, clusters, and the odd points that are not noise.",
      "detail": "Knowledge discovery, preparation, warehousing, pattern mining, classification, regression, clustering, and outlier detection. The emphasis is on getting a pattern out of data you did not design."
    },
    {
      "code": "MATH 110",
      "name": "Calculus I",
      "area": "MATH",
      "credits": "3",
      "level": "Undergraduate",
      "summary": "Rates of change, the language of many learning methods.",
      "detail": "Gradients and optimization later in the degree are calculus with a dataset attached. This is the first pass."
    },
    {
      "code": "MATH 111",
      "name": "Calculus II",
      "area": "MATH",
      "credits": "3",

            <button class="pill" type="button" data-level="Graduate" aria-pressed="false">Master of Science</button>
          </div>
          <div class="lead" id="level-copy"></div>
        </div>
        <aside class="facts">
          <p class="kicker" style="color:var(--gold)">Quick facts</p>
          <dl id="facts"></dl>
          <a id="official" href="https://www.uregina.ca/academics/programs/science/data-science.html">Official program page</a>
        </aside>
      </div>
    </section>
    <section class="section" id="courses">
      <div class="wrap split">
        <div>
          <p class="kicker">The list</p>
          <h2 id="courses-title"></h2>
          <p class="muted" id="courses-copy" style="line-height:1.6"></p>
          <a class="btn outline" href="#curriculum" data-nav="curriculum" style="margin-top:1rem">Open the full checklist</a>
        </div>
        <div class="accordion" id="featured"></div>
      </div>
    </section>
    <section class="skills" id="skills">
      <div class="wrap section">
        <p class="kicker">Skills</p>
        <h2 style="color:white">What you can do with data</h2>
        <p class="intro">Six skills sit under the degree. Pick one to read what it means when you are working with data.</p>
        <div class="skill-layout">
          <div class="skill-grid" id="skill-grid" role="list"></div>
          <div class="skill-detail" id="skill-detail"></div>
        </div>
      </div>
    </section>
    <section class="section" id="careers">
      <div class="wrap">
        <p class="kicker">After the degree</p>
        <h2>Where the faculty says this leads</h2>
        <p class="muted lead">SGI, Farm Credit Canada, Deloitte, and SaskEnergy are the employers named on the program page. Pick a sector. The courses follow the degree selected above, and each fit is a reading of that course’s published topics. It is not a placement list.</p>
        <div class="tabs" id="sectors" role="tablist" aria-label="Sectors"></div>
        <div class="career" id="career" role="tabpanel"></div>
      </div>
    </section>
    <section class="faq section" id="questions">
      <div class="wrap">
        <div class="faq-head">
          <div>
            <p class="kicker">Questions</p>
            <h2>Before you treat this as an offer</h2>
          </div>
          <label>Search questions<span class="sr"> </span>
            <input class="search" id="faq-search" placeholder="Search questions">
          </label>
        </div>
        <div id="faq-list"></div>
      </div>
    </section>`;
}

function curriculumHtml() {
  return `
    <div class="wrap section">
      <p class="crumbs">U of R / Faculty of Science / Computer Science / Courses</p>
      <h1>The checklist, as something you can filter</h1>
      <p class="muted lead" id="curr-lead"></p>
      <div class="pills">
        <button class="pill" type="button" data-level="Undergraduate" aria-pressed="true">B.Sc. checklist</button>
        <button class="pill ghost" type="button" data-level="Graduate" aria-pressed="false">M.Sc. curriculum</button>
      </div>
      <label style="display:block;margin-top:1.2rem;max-width:28rem">
        <span class="sr">Search courses</span>
        <input class="search" id="course-search" placeholder="Search by code or topic" style="background:var(--card)">
      </label>
      <div id="course-results"></div>
    </div>`;
}


function boot() {
const app = document.getElementById("app");
app.innerHTML = header() + (page === "home" ? homeHtml() : curriculumHtml()) + footer();

const menuBtn = document.querySelector(".menu-btn");
const sheet = document.querySelector(".sheet");
const sheetBack = document.querySelector(".sheet-back");
function closeMenu() {
  sheet.hidden = true;
  sheetBack.hidden = true;
}
menuBtn.addEventListener("click", () => {
  sheet.hidden = false;
  sheetBack.hidden = false;
});
sheetBack.addEventListener("click", closeMenu);
document.querySelector(".sheet-close").addEventListener("click", closeMenu);

function bindAccordion(root) {
  root.querySelectorAll(".acc-btn").forEach((button) => {
    button.addEventListener("click", () => {
      const item = button.parentElement;
      const open = item.classList.contains("open");
      root.querySelectorAll(".acc-item").forEach((node) => {
        node.classList.remove("open");
        const trigger = node.querySelector(".acc-btn");
        trigger.setAttribute("aria-expanded", "false");
        trigger.lastElementChild.textContent = "▾";
      });
      if (!open) {
        item.classList.add("open");
        button.setAttribute("aria-expanded", "true");
        button.lastElementChild.textContent = "▴";
      }
    });
  });
}

if (page === "home") {
  const copy = document.getElementById("level-copy");
  const factsList = document.getElementById("facts");
  const official = document.getElementById("official");
  function renderFeatured(level) {
    const title = document.getElementById("courses-title");
    const blurb = document.getElementById("courses-copy");
    const codes = featuredByLevel[level];
    if (level === "Undergraduate") {
      title.textContent = "Courses in the bachelor’s";
      blurb.textContent = "This column is a selection, not the whole degree. The program page uses data structures, artificial intelligence, algorithms, databases, and data mining as its examples. The required list adds an introduction to data science, statistical learning, and a capstone that either Computer Science or Statistics can host. Open a course to read what it covers. Every required code is on the Courses page.";
    } else {
      title.textContent = "Courses in the master’s";
      blurb.textContent = "This column is the whole required curriculum, not a sample. The department teaches it in order: two courses in the first fall, two in the winter, two in the spring or summer, two more the next fall, then the seminar and the project in the last winter. Open a course to read what that step covers.";
    }
    const root = document.getElementById("featured");
    root.innerHTML = codes
      .map((code) => {
        const course = DATA.courses.find((item) => item.code === code);
        const open = code === codes[0];
        return `<div class="acc-item ${open ? "open" : ""}"><button class="acc-btn" type="button" aria-expanded="${open}"><span><span class="code">${esc(course.code)}</span>${esc(course.name)}</span><span aria-hidden="true">${open ? "▴" : "▾"}</span></button><div class="acc-panel">${esc(course.detail)}</div></div>`;
      })
      .join("");
    bindAccordion(root);
  }
  function setLevel(level) {
    programLevel = level;
    document.querySelectorAll(".hero [data-level]").forEach((button) => {
      button.setAttribute("aria-pressed", String(button.dataset.level === level));
    });
    if (level === "Undergraduate") {
      copy.innerHTML = `<p>Data now sits behind decisions in health, climate research, biology, and many other fields. The bachelor’s, taught by Computer Science together with Mathematics and Statistics, is where you learn to explore a data set, prepare it, picture it, compute with it, and make a prediction.</p><p>The same years also cover the working habits the faculty names with the technical work: problem solving, time management, teamwork, integrity, and communication. The aim is a graduate who can manage a large data set, interpret it, and draw a conclusion from it.</p>`;
      official.href = "https://www.uregina.ca/academics/programs/science/data-science.html";
    } else {
      copy.innerHTML = `<p>This is the department’s professionally focused master’s, not a thesis. It starts from data-centred programming and the statistical ideas under machine learning, then moves through applied learning, large-scale analytics, and cloud computing.</p><p>The published order is fixed. It finishes with a seminar on professional practice and a capstone project that is presented in public. The first term of this style of program can be taken online.</p>`;
      official.href = "https://www.uregina.ca/science/computer-science/graduate-programs/msc-cs-data-science.html";
    }
    factsList.innerHTML = facts[level]
      .map(([label, value]) => `<dt>${esc(label)}</dt><dd>${esc(value)}</dd>`)
      .join("");
    renderFeatured(level);
  }
  document.querySelectorAll(".hero [data-level]").forEach((button) => {
    button.addEventListener("click", () => {
      setLevel(button.dataset.level);
      renderCareer();
    });
  });
  setLevel(programLevel);

  const icon = (paths) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths}</svg>`;
  const skills = [
    {
      id: "code",
      name: "Programming",
      short: "Turn a problem into code",
      detail: "You learn to break a question into steps a computer can repeat, then organize that code so someone else can change it.",
      points: ["Write clear procedures in a general-purpose language", "Use Python for tables, models, and data work", "Structure larger programs so they stay maintainable"],
      svg: icon(`<polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/>`),
    },
    {
      id: "stats",
      name: "Statistics",
      short: "Say how sure you are",
      detail: "A result is a claim about more than the rows in front of you. Statistics is how you estimate, test, and show the uncertainty.",
      points: ["Summarize variation instead of a single number", "Estimate and test from a sample", "Fit linear models and check when the fit is wrong"],
      svg: icon(`<path d="M4 19V10"/><path d="M10 19V5"/><path d="M16 19v-6"/><path d="M3 19h16"/>`),
    },
    {
      id: "learn",
      name: "Machine learning",
      short: "Find a pattern, then check it",
      detail: "You learn the main ways a model can search, classify, and predict, and the checks that stop a neat fit from being a false one.",
      points: ["Compare search, reasoning, and learning methods", "Train models for prediction", "Notice over-fitting and measure accuracy"],
      svg: icon(`<circle cx="6" cy="7" r="2"/><circle cx="17" cy="6" r="2"/><circle cx="8" cy="17" r="2"/><circle cx="17" cy="16" r="2"/><path d="M8 8l7-1M8 16l7-1M8 9v6"/>`),
    },
    {
      id: "wrangle",
      name: "Data wrangling",
      short: "Make a messy table usable",
      detail: "Most of a real project is preparation. You learn to clean, join, and record what changed before anyone trusts an analysis.",
      points: ["Repair missing values and odd formats", "Join sources that do not quite match", "Keep a record of every change"],
      svg: icon(`<path d="M4 6h16"/><path d="M4 12h10"/><path d="M4 18h7"/><path d="M17 14l3 3-3 3"/>`),
    },
    {
      id: "data",
      name: "Databases",
      short: "Store data so it can be asked",
      detail: "Spreadsheets run out. You learn to model data, query it, and retrieve the rows a question actually needs.",
      points: ["Model tables and relationships", "Write queries instead of copying cells", "Understand transactions and retrieval"],
      svg: icon(`<ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6"/><path d="M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/>`),
    },
    {
      id: "math",
      name: "Mathematics",
      short: "The language under the methods",
      detail: "Calculus, linear algebra, and proof sit under optimization, high-dimensional data, and any claim you want to justify.",
      points: ["Use rates of change and linear algebra", "Treat a wide table as vectors and matrices", "Write why a statement follows"],
      svg: icon(`<path d="M4 18 10 6l4 7 2-3 4 8"/>`),
    },
  ];
  let skillId = skills[0].id;
  const skillGrid = document.getElementById("skill-grid");
  const skillDetail = document.getElementById("skill-detail");
  function renderSkills() {
    skillGrid.innerHTML = skills
      .map(
        (skill) => `<button class="skill-card" type="button" role="listitem" data-skill="${skill.id}" aria-pressed="${skill.id === skillId}"><span class="skill-ico">${skill.svg}</span><span><strong>${esc(skill.name)}</strong><small>${esc(skill.short)}</small></span></button>`
      )
      .join("");
    const skill = skills.find((item) => item.id === skillId);
    skillDetail.innerHTML = `
      <p class="muted" style="font-size:0.72rem;letter-spacing:0.12em;text-transform:uppercase;margin:0">Selected skill</p>
      <h3>${esc(skill.name)}</h3>
      <p>${esc(skill.detail)}</p>
      <ul class="skill-points">${skill.points.map((point) => `<li>${esc(point)}</li>`).join("")}</ul>`;
  }
  skillGrid.addEventListener("click", (event) => {
    const button = event.target.closest("[data-skill]");
    if (!button) return;
    skillId = button.dataset.skill;
    renderSkills();
  });
  renderSkills();

  const sectors = document.getElementById("sectors");
  const career = document.getElementById("career");
  let careerId = DATA.careers[0].id;
  sectors.innerHTML = DATA.careers
    .map(
      (item) => `<button class="chip" type="button" role="tab" data-career="${item.id}" aria-pressed="false" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${item.icon}</svg>${esc(item.sector)}</button>`
    )
    .join("");
  function renderCareer() {
    sectors.querySelectorAll("[data-career]").forEach((button) => {
      const on = button.dataset.career === careerId;
      button.setAttribute("aria-pressed", String(on));
      button.setAttribute("aria-selected", String(on));
    });
    const item = DATA.careers.find((entry) => entry.id === careerId);
    const picks = item.courses[programLevel] || [];
    career.innerHTML = `
      <div>
        <p class="muted" style="font-size:0.75rem;margin:0">${esc(item.employer)}</p>
        <h3 class="display" style="font-size:1.6rem;margin-top:0.3rem">${esc(item.role)}</h3>
        <p style="line-height:1.6">${esc(item.blurb)}</p>
      </div>
      <div class="course-list">
        <p class="muted" style="font-size:0.72rem;letter-spacing:0.08em;text-transform:uppercase;margin:0">Courses that feed this work</p>
        <ul>${picks.map((pick) => `<li>${esc(pick.code)}</li>`).join("")}</ul>
      </div>`;
  }
  sectors.addEventListener("click", (event) => {
    const button = event.target.closest("button");
    if (!button) return;
    careerId = button.dataset.career;
    renderCareer();
  });
  sectors.addEventListener("keydown", (event) => {
    if (event.key !== "ArrowRight" && event.key !== "ArrowLeft") return;
    event.preventDefault();
    const index = DATA.careers.findIndex((item) => item.id === careerId);
    const step = event.key === "ArrowRight" ? 1 : -1;
    const next = DATA.careers[(index + step + DATA.careers.length) % DATA.careers.length];
    careerId = next.id;
    renderCareer();
    sectors.querySelector(`[data-career="${careerId}"]`).focus();
  });
  renderCareer();

  const faqList = document.getElementById("faq-list");
  function renderFaq() {
    const needle = document.getElementById("faq-search").value.trim().toLowerCase();
    const rows = DATA.faqs.filter((item) => `${item.question} ${item.answer}`.toLowerCase().includes(needle));
    if (!rows.length) {
      faqList.innerHTML = `<p class="empty">Nothing in the list matches “${esc(document.getElementById("faq-search").value)}”. Try “transfer”, “scholarship”, or “thesis”.</p>`;
      return;
    }
    faqList.innerHTML = `<div class="accordion">${rows
      .map(
        (item) => `<div class="acc-item"><button class="acc-btn" type="button" aria-expanded="false"><span>${esc(item.question)}</span><span aria-hidden="true">▾</span></button><div class="acc-panel">${esc(item.answer)}</div></div>`
      )
      .join("")}</div>`;
    bindAccordion(faqList);
  }
  document.getElementById("faq-search").addEventListener("input", renderFaq);
  renderFaq();
}

if (page === "curriculum") {
  let level = programLevel;
  const results = document.getElementById("course-results");

  function renderCourses() {
    const needle = document.getElementById("course-search").value.trim().toLowerCase();
    const visible = DATA.courses.filter((course) => {
      if (course.level !== level) return false;
      if (!needle) return true;
      return `${course.code} ${course.name} ${course.summary}`.toLowerCase().includes(needle);
    });
    if (!visible.length) {
      results.innerHTML = `<div class="empty"><p class="display" style="font-size:1.6rem;color:var(--foreground);margin:0">No course cards for this slice</p><p>Nothing matches “${esc(document.getElementById("course-search").value)}”. Clear the search.</p></div>`;
      return;
    }
    results.innerHTML = `<ul class="grid2">${visible
      .map(
        (course) => `<li><button class="card" type="button" data-code="${esc(course.code)}"><span class="card-top"><span class="code" style="font-family:ui-monospace,monospace;font-size:0.75rem;color:var(--primary)">${esc(course.code)}</span><span class="badge">${esc(course.area)}</span></span><h3>${esc(course.name)}</h3><p>${esc(course.summary)}</p></button></li>`
      )
      .join("")}</ul>`;
  }

  function renderAll() {
    programLevel = level;
    document.querySelectorAll(".pills [data-level]").forEach((button) => {
      const on = button.dataset.level === level;
      button.setAttribute("aria-pressed", String(on));
      button.classList.toggle("ghost", !on);
    });
    document.getElementById("curr-lead").textContent =
      level === "Undergraduate"
        ? "Twenty-five required courses are listed here: eleven computer science, six statistics, four mathematics, and four cross-listed."
        : "The master’s checklist is not the bachelor’s list. It is the department’s strict 30-credit sequence, from CS 700 through the CS 719 project.";
    renderCourses();
  }

  document.querySelector(".pills").addEventListener("click", (event) => {
    const button = event.target.closest("[data-level]");
    if (!button) return;
    level = button.dataset.level;
    renderAll();
  });
  document.getElementById("course-search").addEventListener("input", renderCourses);
  results.addEventListener("click", (event) => {
    const button = event.target.closest(".card");
    if (!button) return;
    const course = DATA.courses.find((item) => item.code === button.dataset.code);
    const back = document.createElement("div");
    back.className = "modal-back";
    back.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="dlg-title"><button class="icon-btn x" type="button" aria-label="Close">×</button><h2 id="dlg-title">${esc(course.name)}</h2><p class="muted">${esc(course.code)} · ${esc(course.credits)} credit hours · ${esc(course.level)}</p><p>${esc(course.detail)}</p></div>`;
    document.body.append(back);
    const close = () => back.remove();
    back.addEventListener("click", (click) => {
      if (click.target === back || click.target.closest(".x")) close();
    });
    document.addEventListener(
      "keydown",
      function onKey(keyEvent) {
        if (keyEvent.key === "Escape") {
          close();
          document.removeEventListener("keydown", onKey);
        }
      }
    );
  });
  renderAll();
}

}
boot();
document.addEventListener("click", (event) => {
  const link = event.target.closest("[data-nav]");
  if (!link) return;
  event.preventDefault();
  const next = link.getAttribute("data-nav");
  const hash = next === "curriculum" ? "#curriculum" : "#program";
  if (location.hash === hash) {
    const sheet = document.querySelector(".sheet");
    const sheetBack = document.querySelector(".sheet-back");
    if (sheet) sheet.hidden = true;
    if (sheetBack) sheetBack.hidden = true;
    return;
  }
  location.hash = hash;
});
function scrollToHash() {
  const id = location.hash.replace("#", "");
  if (!id || id === "program" || id === "curriculum") return;
  const target = document.getElementById(id);
  if (target) target.scrollIntoView({ behavior: "instant", block: "start" });
}
window.addEventListener("hashchange", () => {
  const next = pageFromHash();
  if (next !== page) {
    page = next;
    boot();
    window.scrollTo(0, 0);
    return;
  }
  scrollToHash();
});
scrollToHash();

  </script>
</body>
</html>
